name: Bug report
description: Something in Origami does not work as it should
body:
  - type: input
    id: version
    attributes:
      label: Origami version
      description: Shown under the name on the launch screen.
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      description: Apple menu › About This Mac.
      placeholder: macOS 15.6
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What you did and what happened
      description: Step by step, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: script
    attributes:
      label: The smallest script that shows it
      render: js
  - type: textarea
    id: log
    attributes:
      label: Crash log
      description: If Origami crashed, attach ~/Library/Logs/Origami/origami.log, or the newest origami-app report in ~/Library/Logs/DiagnosticReports if it quit without writing there. Check it for anything private first.
