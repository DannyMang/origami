name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: macos-14
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v4
      - run: brew install ffmpeg
      - run: rustup update stable && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('origami-*/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: origami-lang
        run: |
          cargo fmt --check --manifest-path origami-lang/Cargo.toml
          cargo build --release --manifest-path origami-lang/Cargo.toml
          cargo test --release --manifest-path origami-lang/Cargo.toml
      - name: origami-engine
        run: |
          cargo fmt --check --manifest-path origami-engine/Cargo.toml
          cargo build --release --manifest-path origami-engine/Cargo.toml
          cargo test --release --manifest-path origami-engine/Cargo.toml
      - name: origami-app
        run: |
          cargo fmt --check --manifest-path origami-app/Cargo.toml
          cargo build --release --manifest-path origami-app/Cargo.toml
          cargo test --release --manifest-path origami-app/Cargo.toml
