name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: brew install ffmpeg
      - run: rustup update stable && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ matrix.os }}-${{ hashFiles('origami-*/Cargo.lock') }}
          restore-keys: cargo-${{ matrix.os }}-
      - name: origami-lang
        run: |
          cargo fmt --check --manifest-path origami-lang/Cargo.toml
          cargo build --release --manifest-path origami-lang/Cargo.toml
          cargo test --release --manifest-path origami-lang/Cargo.toml
      - name: origami-engine
        run: |
          cargo fmt --check --manifest-path origami-engine/Cargo.toml
          cargo build --release --manifest-path origami-engine/Cargo.toml
          cargo test --release --manifest-path origami-engine/Cargo.toml
      - name: origami-app
        run: |
          cargo fmt --check --manifest-path origami-app/Cargo.toml
          cargo build --release --manifest-path origami-app/Cargo.toml
          cargo test --release --manifest-path origami-app/Cargo.toml
      - name: app bundle
        run: |
          ./bundle.sh
          echo 'color("#203040").for(1)' > "$RUNNER_TEMP/edit.js"
          dist/Origami.app/Contents/MacOS/origami render "$RUNNER_TEMP/edit.js" "$RUNNER_TEMP/out.mp4"
          ffprobe -v error -show_entries format=duration -of csv=p=0 "$RUNNER_TEMP/out.mp4"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: Origami-${{ matrix.os }}
          path: dist/Origami.dmg
          if-no-files-found: error
